<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šest trumfů</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a deck of trump cards. Every idea is a stat card (6 stats, 1–5) laid next to the card it beats;
   slides are full-screen sections that snap on desktop and simply stack on phones. */
:root{
  --paper:#ECEEF3; --card:#FFFFFF; --ink:#141829; --muted:#5A6077; --line:#D3D7E2;
  --accent:#2B3CD0; --accent-soft:rgba(43,60,208,.10); --bench:#A3A9BC;
  --win:#0B7F57; --lose:#B83A26;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 0 rgba(20,24,41,.06),0 10px 30px -12px rgba(20,24,41,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1220; --card:#181C2F; --ink:#E7E9F2; --muted:#959BB2; --line:#2A3048;
  --accent:#8E9BFF; --accent-soft:rgba(142,155,255,.13); --bench:#545B76;
  --win:#3FCB92; --lose:#FF7B63; --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1220; --card:#181C2F; --ink:#E7E9F2; --muted:#959BB2; --line:#2A3048;
  --accent:#8E9BFF; --accent-soft:rgba(142,155,255,.13); --bench:#545B76;
  --win:#3FCB92; --lose:#FF7B63; --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (min-width:1000px) and (min-height:700px){html{scroll-snap-type:y mandatory}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15.5px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}

.slide{min-height:100svh;scroll-snap-align:start;display:flex;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(28px,5vh,56px);border-bottom:1px solid var(--line)}
.inner{width:100%;max-width:1240px;margin:0 auto;display:grid;gap:clamp(18px,2.6vh,28px);min-width:0}

.eyebrow{font:600 12px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.eyebrow b{color:var(--accent);font-weight:600}
.lead{font-size:clamp(16px,1.35vw,19px);color:var(--muted);max-width:62ch}

/* ---------- title ---------- */
.title h1{font-size:clamp(56px,10.5vw,152px);line-height:.86;font-weight:900;font-stretch:125%;letter-spacing:-.02em}
.title h1 span{color:var(--accent)}
.fan{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.fan .mini{flex:1 1 150px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;box-shadow:var(--shadow);
  transform:rotate(var(--r,0deg));transition:transform .25s ease}
.fan .mini:hover{transform:rotate(0deg) translateY(-4px)}
.mini .k{font:600 11px/1 var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.mini .n{font:800 19px/1.1 var(--display);font-stretch:110%;margin-top:8px}
.mini .t{font:600 11.5px/1.35 var(--mono);color:var(--accent);margin-top:10px}
.meta{font:500 13px/1.5 var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 22px}

/* ---------- stat card ---------- */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 16px;display:grid;gap:12px;align-content:start;min-width:0;position:relative}
.tcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tcard .no{font:900 34px/1 var(--display);font-stretch:125%;color:var(--accent)}
.tcard .sum{font:600 12px/1.3 var(--mono);color:var(--muted);text-align:right}
.tcard .sum b{display:block;font:800 26px/1 var(--display);font-stretch:110%;color:var(--ink)}
.stats{display:grid;gap:9px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.stat .lab{font:600 12.5px/1.2 var(--body);display:flex;gap:6px;align-items:center}
.stat .mark{font:700 11px/1 var(--mono)}
.stat .mark.w{color:var(--win)} .stat .mark.l{color:var(--lose)} .stat .mark.e{color:var(--muted)}
.stat .val{font:600 12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.stat .val b{color:var(--ink);font-weight:600}
.pips{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.pips i{height:7px;border-radius:2px;background:var(--line);position:relative}
.pips i.on{background:var(--accent)}
.pips i.b::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:1px;background:var(--bench)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:500 11px/1.2 var(--mono);color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:6px;border-radius:2px;background:var(--accent);display:inline-block}
.legend i.b{height:2px;background:var(--bench)}

/* ---------- idea slide ---------- */
.idea .head{display:grid;gap:8px}
.idea h2{font-size:clamp(34px,4.6vw,62px);line-height:.95;font-weight:850;font-stretch:118%;letter-spacing:-.015em}
.idea .hook{font:600 clamp(17px,1.55vw,22px)/1.3 var(--body);max-width:60ch}
.idea .grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:clamp(18px,2.4vw,34px);align-items:start}
.body{display:grid;gap:16px;min-width:0}
.problem{font-size:15.5px;color:var(--muted);max-width:75ch}
.problem b{color:var(--ink);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
.steps li{counter-increment:s;padding-top:10px;border-top:2px solid var(--ink);font-size:14.5px;line-height:1.45;min-width:0}
.steps li::before{content:counter(s);display:block;font:800 13px/1 var(--mono);color:var(--accent);margin-bottom:6px}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
.blk{display:grid;gap:4px;min-width:0;font-size:14px;line-height:1.45}
.blk h3{font:600 11.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.blk.beat{grid-column:1/-1;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.blk.beat h3{color:var(--accent)}
.blk.beat ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
.blk.beat li{padding-left:16px;position:relative}
.blk.beat li::before{content:"▲";position:absolute;left:0;top:.15em;font-size:9px;color:var(--accent)}
.foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;border-top:1px solid var(--line);padding-top:12px}
.foot .blk{font-size:13.5px;color:var(--muted)}
.foot .blk strong{color:var(--ink);font-weight:600}

/* ---------- bar slide ---------- */
.bench-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.bcard .n{font:800 20px/1.1 var(--display);font-stretch:112%}
.bcard p{font-size:14px;color:var(--muted)}
.bcard .sc{font:600 12px/1 var(--mono);color:var(--muted);margin-top:4px}
.bcard .sc b{font:800 22px/1 var(--display);color:var(--ink)}
.rule{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.rule .test{border:2px solid var(--ink);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.rule .test h3{font:800 22px/1.1 var(--display);font-stretch:115%}
.rule .test p{font-size:15px}
.crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;counter-reset:c}
.crit li{font-size:14px;line-height:1.4;min-width:0}
.crit li b{display:block;font-family:var(--display);font-weight:750;font-size:15px}

/* ---------- comparison table ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line);font:500 14px/1.2 var(--mono)}
th{font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
td:first-child,th:first-child{text-align:left;font:700 15px/1.2 var(--display);font-stretch:108%}
td .vs{display:block;font:500 11px/1.2 var(--mono);color:var(--muted);margin-top:3px;font-stretch:100%}
tr.bm td{color:var(--muted)}
tr.bm td:first-child{font-weight:600}
tr:last-child td{border-bottom:0}
td.tot{font:800 18px/1 var(--display)}
tr.idea-row td.tot{color:var(--accent)}
.cell{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:6px}
.c5{background:var(--accent);color:var(--card)} .c4{background:var(--accent-soft);color:var(--accent);font-weight:600}
.split{display:flex;align-items:center;gap:8px;padding:12px;border-top:2px solid var(--ink)}
.note{font-size:13px;color:var(--muted);max-width:90ch}

/* ---------- next steps ---------- */
.queue{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:q}
.queue li{counter-increment:q;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.queue li::before{content:counter(q);font:900 28px/1 var(--display);font-stretch:125%;color:var(--accent)}
.queue .n{font:800 18px/1.1 var(--display);font-stretch:110%}
.queue p{font-size:14px;color:var(--muted)}
.chip{justify-self:start;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:99px;border:1px solid currentColor}
.chip.auto{color:var(--win)} .chip.human{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.facts div{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.facts b{display:block;color:var(--ink);font:750 16px/1.25 var(--display);margin-bottom:2px}

.src{columns:2 340px;column-gap:28px;font-size:13px;line-height:1.5}
.src li{break-inside:avoid;margin-bottom:6px;color:var(--muted)}
.src a{word-break:break-word}

/* ---------- nav ---------- */
.nav{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;
  display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--shadow)}
.nav button{appearance:none;border:0;background:transparent;color:var(--ink);width:34px;height:34px;border-radius:99px;font:600 15px/1 var(--mono);cursor:pointer}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav .pos{font:600 12px/1 var(--mono);color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}

@media (max-width:1080px){
  .idea .grid{grid-template-columns:1fr}
  .tcard{max-width:520px}
  .bench-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rule{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{font-size:15px}
  .steps,.blocks,.foot,.blk.beat ul,.crit,.queue,.facts,.bench-row{grid-template-columns:1fr}
  .fan .mini{transform:none;flex-basis:140px}
  .slide{padding-block:40px 72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<main id="deck"></main>
<nav class="nav" aria-label="Navigace prezentace">
  <button id="prev" type="button" aria-label="Předchozí slide">↑</button>
  <span class="pos" id="pos">1 / 11</span>
  <button id="next" type="button" aria-label="Další slide">↓</button>
</nav>

/* Czech typography: keep one-letter prepositions on the line with the next word. */
const nb = s => s.replace(/(^|[\s(„>])([vkszaiouVKSZAIOU])\s/g, "$1$2 ");
const sum = a => a.reduce((x,y)=>x+y,0);

function pips(v, b){
  let h = "";
  for(let i=1;i<=5;i++) h += `<i class="${i<=v?"on":""} ${i===b?"b":""}"></i>`;
  return `<span class="pips" aria-hidden="true">${h}</span>`;
}
function statCard(idea, n){
  const b = BENCH[idea.vs];
  const rows = idea.s.map((v,i)=>{
    const bv = b.s[i], d = v-bv;
    const m = d>0 ? `<span class="mark w" title="lepší">▲ ${d}</span>` : d<0 ? `<span class="mark l" title="horší">▼ ${-d}</span>` : `<span class="mark e" title="stejné">=</span>`;
    return `<li class="stat"><span class="lab">${CRIT[i]} ${m}</span><span class="val"><b>${v}</b> / vzor ${bv}</span>${pips(v,bv)}</li>`;
  }).join("");
  return `<aside class="tcard" aria-label="Skóre ${idea.name} proti ${b.name}">
    <div class="top"><span class="no">T${n}</span><span class="sum"><b>${sum(idea.s)}</b>bodů z 30 · vzor ${sum(b.s)}</span></div>
    <ul class="stats">${rows}</ul>
    <div class="legend"><span><i></i>${idea.name}</span><span><i class="b"></i>${b.name}</span></div>
  </aside>`;
}

function slideTitle(){

  return `<section class="slide title" id="uvod"><div class="inner">
    <div class="eyebrow"><b>Crypto produkty</b><span>6 nápadů</span><span>listopad 2026</span></div>

const deck = document.getElementById("deck");
deck.innerHTML = slideTitle() + slideBar() + IDEAS.map(slideIdea).join("") + slideTable() + slideNext() + slideSources();

/* Navigation: arrows, PageUp/Down, space, buttons; the counter follows the scroll. */
const slides = [...deck.querySelectorAll(".slide")];
const pos = document.getElementById("pos");
let cur = 0;
const go = i => { cur = Math.max(0, Math.min(slides.length-1, i)); slides[cur].scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); };
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ cur = slides.indexOf(e.target); pos.textContent = `${cur+1} / ${slides.length}`; } });
},{threshold:.5});
slides.forEach(s=>io.observe(s));
pos.textContent = `1 / ${slides.length}`;
document.getElementById("prev").addEventListener("click",()=>go(cur-1));
document.getElementById("next").addEventListener("click",()=>go(cur+1));
addEventListener("keydown",e=>{
  if(e.target.closest && e.target.closest("input,textarea")) return;
  if(["ArrowDown","ArrowRight","PageDown"," "].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(["ArrowUp","ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==="Home"){ e.preventDefault(); go(0); }
  else if(e.key==="End"){ e.preventDefault(); go(slides.length-1); }
});
